<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Collector Game</title>
    <style>

        body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f2f8ff;
    }

     #gameCanvas {
      border: 2px solid black;
      background: white;
      display: none;
      margin-top: 20px;
    }
    .btn {
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: #4caf50;
      color: white;
    }
    </style>
</head>
<body>
    
     <h1>Medicine Collector Game</h1>
  <div id="menu">
    <h2>What is wrong with you today?</h2>
    <button class="btn" onclick="startGame('headache', 'red')">Headache</button>
    <button class="btn" onclick="startGame('stomach ache', 'blue')">Stomach Ache</button>
    <button class="btn" onclick="startGame('high blood pressure', 'green')">High Blood Pressure</button>
  </div>

  <canvas class="gameCanvas" id="gameCanvas" width="400" height="500"></canvas>


  <script>
      
        let canvas = document.getElementById("gameCanvas");
    let ctx = canvas.getContext("2d");

    let player, pills, correctColor, score, health;
    let keys = {};

    function startGame(condition, color) {
      document.getElementById("menu").style.display = "none";
      canvas.style.display = "block";

       correctColor = color;
      score = 0;
      health = 3;
      player = { x: 180, y: 460, width: 40, height: 20, speed: 5 };
      pills = [];

      window.addEventListener("keydown", e => keys[e.key] = true);
      window.addEventListener("keyup", e => keys[e.key] = false);

      gameLoop();
    }

  </script>

</body>
</html>
